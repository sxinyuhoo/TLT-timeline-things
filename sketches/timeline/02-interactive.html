<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>TLT · 时间线原型 v4（可交互）</title>
<style>
  :root{
    --bg:#0D0E12; --panel:#13141A; --panel2:#191A23; --line:#23252F; --line2:#313441;
    --ink:#ECEDF2; --ink2:#C4C6D0; --ink3:#8D90A0; --ink4:#6C6F7E; --ink5:#4C4F5C;
    --acc:#5B6CFF; --acc2:#93A0FF; --hot:#D98080;
    --p1:#5B6CFF; --p2:#31CFAE; --p3:#E2B25A; --p4:#B57BFF;
    --grid:#1A1C25;
  }
  body.light{
    --bg:#F2F4F8; --panel:#FFFFFF; --panel2:#F7F8FC; --line:#DFE3EC; --line2:#C8CEDA;
    --ink:#111318; --ink2:#333947; --ink3:#5A6270; --ink4:#7B8290; --ink5:#9AA0AC;
    --acc:#4453DB; --acc2:#6675EC; --hot:#BF4B45; --p3:#BE8A1E;
    --grid:#E7EBF2;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);
    font:13px/1.5 -apple-system,"Helvetica Neue","PingFang SC","Hiragino Sans GB",sans-serif;
    -webkit-font-smoothing:antialiased;user-select:none}
  .app{width:1096px;margin:0 auto;padding:24px 0 34px}

  header{display:flex;align-items:flex-end;gap:18px;padding:0 3px 13px}
  .kicker{display:block;font-size:9px;letter-spacing:.18em;color:var(--ink4);margin-bottom:5px}
  h1{margin:0;font-size:21px;font-weight:600;letter-spacing:-.3px;font-variant-numeric:tabular-nums}
  h1 em{font-style:normal;font-size:11.5px;color:var(--ink4);margin-left:7px;font-weight:400}
  .stats{display:flex;gap:15px;padding-bottom:2px}
  .stat{font-size:10px;color:var(--ink3);font-variant-numeric:tabular-nums;letter-spacing:.02em}
  .stat b{display:block;font-size:14.5px;color:var(--ink2);font-weight:600;margin-top:1px;letter-spacing:-.1px}
  .hsp{flex:1}
  .tabs{display:flex;gap:2px;padding:3px;border:1px solid var(--line);border-radius:9px;background:var(--panel)}
  .tab{border:0;background:none;color:var(--ink3);font:inherit;font-size:11px;padding:5px 11px;border-radius:6px;cursor:pointer;transition:.12s}
  .tab:hover{color:var(--ink2)}
  .tab.on{background:var(--panel2);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line2)}
  .ico{border:1px solid var(--line);background:var(--panel);color:var(--ink3);width:29px;height:29px;border-radius:8px;
       cursor:pointer;font-size:11px;display:grid;place-items:center;transition:.12s}
  .ico:hover{color:var(--ink);border-color:var(--line2)}
  .ico.wide{width:auto;padding:0 10px;font-size:11px}

  main{display:grid;grid-template-columns:1fr 262px;gap:12px;align-items:stretch}
  .stage{position:relative;display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px 8px}
  .side{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:13px 12px 10px;align-self:stretch;overflow:auto;max-height:640px}
  .side h3{margin:0 0 9px;font-size:9.5px;letter-spacing:.13em;color:var(--ink4);font-weight:500}
  .side h3.sub{margin-top:13px}

  .axis{display:flex;margin-top:2px;color:var(--ink4);font-size:9px;font-variant-numeric:tabular-nums}
  .axis span{flex:1}
  .axis span:last-child{flex:none}
  .legend{display:flex;flex-wrap:wrap;gap:11px;margin-top:8px;padding-top:8px;border-top:1px solid var(--line)}
  .lg{display:flex;align-items:center;gap:5px;color:var(--ink3);font-size:10px}
  .lg i{width:8px;height:8px;border-radius:2px}
  .hintline{font-size:10px;color:var(--ink4);margin-top:7px}
  .chips{display:flex;flex-wrap:wrap;align-items:center;gap:7px 8px;margin-top:9px}
  .chip-lab{font-size:9.5px;color:var(--ink4);letter-spacing:.02em;margin-right:2px}
  .chip{display:inline-flex;align-items:center;gap:5px;font-size:10px;color:var(--ink2);
    background:var(--panel2);border:1px solid var(--line);border-radius:20px;padding:2px 8px;cursor:pointer}
  .chip:hover{border-color:var(--line2)}
  .chip i{width:5px;height:5px;border-radius:50%}
  .facts{display:flex;gap:0;margin-top:auto;padding-top:9px;border-top:1px solid var(--line)}
  .fact{flex:1;padding:8px 0 2px;display:flex;flex-direction:column;gap:1px}
  .fact+.fact{border-left:1px solid var(--line);padding-left:12px}
  .fact span{font-size:9px;color:var(--ink4);letter-spacing:.05em}
  .fact b{font-size:12.5px;color:var(--ink2);font-weight:600;font-variant-numeric:tabular-nums}

  .tip{position:fixed;z-index:50;pointer-events:none;opacity:0;transform:translateY(3px);transition:opacity .1s,transform .1s;
       background:var(--panel2);border:1px solid var(--line2);border-radius:8px;padding:6px 9px;max-width:300px}
  .tip.on{opacity:1;transform:none}
  .tip b{display:block;font-size:11.5px;color:var(--ink);font-weight:550;margin-bottom:2px}
  .tip span{font-size:10px;color:var(--ink4);font-variant-numeric:tabular-nums}

  .item{display:flex;gap:7px;padding:5px 4px;border-radius:6px;cursor:pointer}
  .item:hover{background:var(--panel2)}
  .item.on{background:var(--panel2);box-shadow:inset 0 0 0 1px var(--line2)}
  .item i{width:2.5px;border-radius:2px;flex:none;background:var(--c);margin:2px 0}
  .item .t{font-size:11px;color:var(--ink2);line-height:1.35}
  .item .m{font-size:9px;color:var(--ink4);font-variant-numeric:tabular-nums;margin-top:1px}
  .empty{color:var(--ink4);font-size:10.5px;line-height:1.7}

  .ed{display:flex;flex-direction:column;gap:7px}
  .ed label{font-size:9px;color:var(--ink4);letter-spacing:.1em;display:block;margin-bottom:3px}
  .ed input,.ed select{width:100%;background:var(--panel2);border:1px solid var(--line2);color:var(--ink);
    border-radius:6px;padding:5px 7px;font:inherit;font-size:11px}
  .ed input:focus,.ed select:focus{outline:none;border-color:var(--acc)}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:7px}
  .btns{display:flex;gap:6px;margin-top:2px}
  .b{border:1px solid var(--line2);background:var(--panel2);color:var(--ink2);border-radius:6px;padding:5px 9px;
     font:inherit;font-size:10.5px;cursor:pointer}
  .b:hover{color:var(--ink)}
  .b.pri{background:var(--acc);border-color:var(--acc);color:#fff}
  .b.danger{color:var(--hot)}

  footer{margin-top:11px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 13px}
  footer .cap{display:flex;gap:8px;align-items:center;margin-bottom:6px}
  footer .cap b{font-size:10.5px;color:var(--ink2);font-weight:600}
  footer .cap span{font-size:10px;color:var(--ink4)}
  .sync{margin-left:auto;font-size:9px;color:var(--ink4);display:flex;align-items:center;gap:5px}
  .sync i{width:5px;height:5px;border-radius:50%;background:var(--p2)}
  pre{max-height:150px;overflow:auto;padding-bottom:6px;-webkit-mask-image:linear-gradient(#000 calc(100% - 16px),transparent);margin:0;font:10px/1.65 ui-monospace,"SF Mono",Menlo,monospace;
      color:var(--ink3);white-space:pre-wrap}
  pre .k{color:var(--acc2)}
  pre .c{color:var(--ink5)}
  pre .hit{background:rgba(91,108,255,.18);border-radius:2px;transition:background .4s}

  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(8px);opacity:0;
    background:var(--panel2);border:1px solid var(--line2);color:var(--ink2);font-size:11px;
    padding:6px 12px;border-radius:8px;transition:.18s;pointer-events:none;z-index:60}
  .toast.on{opacity:1;transform:translateX(-50%)}
</style>
</head>
<body>
<div class="app">
  <header>
    <div>
      <span class="kicker">TLT · TIMELINE</span>
      <h1>2026-11-02<em>周一</em></h1>
    </div>
    <div class="stats">
      <span class="stat">记录<b id="s-log">—</b></span>
      <span class="stat">完成<b id="s-done">—</b></span>
      <span class="stat">在轴时长<b id="s-span">—</b></span>
      <span class="stat">最大并发<b id="s-conc">—</b></span>
      <span class="stat">上下文切换<b id="s-switch">—</b></span>
    </div>
    <div class="hsp"></div>
    <div class="tabs" id="modes">
      <button class="tab on" data-mode="river">航道</button>
      <button class="tab" data-mode="lanes">泳道</button>
      <button class="tab" data-mode="dial">表盘</button>
      <button class="tab" data-mode="week">周脉冲</button>
    </div>
    <button class="ico wide" id="dtime" title="完成项有没有时刻，是两种画法">完成时刻 · 开</button>
    <button class="ico wide" id="play">▶ 回放</button>
    <button class="ico" id="theme">☾</button>
  </header>

  <main>
    <div class="stage" id="stage"></div>
    <aside class="side" id="side"></aside>
  </main>

  <footer>
    <div class="cap"><b>块里就是数据</b><span>不用指定文件 —— 条目直接躺在这个块里，你在图上改，这里实时变</span>
      <span class="sync"><i></i><span id="synctxt">已同步</span></span></div>
    <pre id="src"></pre>
  </footer>
</div>
<div class="tip" id="tip"></div>
<div class="toast" id="toast"></div>

<script>
/* ================= 数据 ================= */
const PROJECTS = {
  "交通核心算法研发": "var(--p1)",
  "omniwise": "var(--p2)",
  "技术预研": "var(--p3)",
  "mvlab 运营管理": "var(--p4)",
};
const M = (h, m = 0) => h * 60 + m;
let items = [
  { id: "a", title: "晨会 · 对齐本周三件大事", s: M(9, 10), e: M(9, 40), proj: "mvlab 运营管理", kind: "log" },
  { id: "b", title: "湖南算法核减项与项目组讨论", s: M(11, 30), e: M(12, 15), proj: "交通核心算法研发", kind: "log" },
  { id: "c", title: "部门里程碑 & 任务梳理", s: M(13, 30), e: M(15, 10), proj: "mvlab 运营管理", kind: "log" },
  { id: "c2", title: "供应商电话 · 数据接口", s: M(14, 20), e: M(14, 50), proj: "技术预研", kind: "log" },
  { id: "c3", title: "验收口径与南理工对齐", s: M(15, 20), e: M(16, 0), proj: "技术预研", kind: "log" },
  { id: "e", title: "aula 视觉算法评审", s: M(17, 0), e: M(17, 30), proj: "omniwise", kind: "log" },
  { id: "f", title: "一车一档 V2.0 需求评审", s: M(10, 12), e: M(10, 12), proj: "交通核心算法研发", kind: "done" },
  { id: "g", title: "taisl_okc 图谱交付", s: M(13, 0), e: M(13, 0), proj: "omniwise", kind: "done" },
  { id: "h", title: "路由模型技术路径调研", s: M(17, 20), e: M(17, 20), proj: "技术预研", kind: "done" },
  { id: "i", title: "SOP 流程定义", s: M(20, 15), e: M(20, 15), proj: "mvlab 运营管理", kind: "done" },
];

/* ================= 状态 ================= */
const DAY = { from: M(6), to: M(24) };
let view = { ...DAY };
let mode = "river";
let sel = "c";
let hover = null;
let playing = false;
let playAt = M(8, 30);
let brush = null;
let drag = null;
let doneTime = true;

const $ = (s, r = document) => r.querySelector(s);
const el = (tag, cls, txt) => { const n = document.createElement(tag); if (cls) n.className = cls; if (txt != null) n.textContent = txt; return n; };
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const fmt = (m) => `${String(Math.floor(m / 60)).padStart(2, "0")}:${String(Math.round(m % 60)).padStart(2, "0")}`;
const dur = (m) => m >= 60 ? (m % 60 ? (m / 60).toFixed(1) : m / 60) + "h" : m + "m";
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const X = (m) => ((m - view.from) / (view.to - view.from)) * 100;

/* 并发分层：给每个区间分配一个层级（interval graph coloring） */
function pack(list) {
  const sorted = [...list].sort((a, b) => a.s - b.s || a.e - b.e);
  const ends = [];
  sorted.forEach((it) => {
    let lv = 0;
    while (ends[lv] !== undefined && ends[lv] > it.s) lv++;
    ends[lv] = it.e; it.lv = lv;
  });
  return Math.max(1, ends.length);
}
function concurrencyAt(t) { return items.filter((i) => i.kind === "log" && i.s <= t && t < i.e).length; }
function maxConc() {
  let mx = 0;
  for (let t = DAY.from; t < DAY.to; t += 5) mx = Math.max(mx, concurrencyAt(t));
  return mx;
}

function stats() {
  const logs = items.filter((i) => i.kind === "log");
  const done = items.filter((i) => i.kind === "done");
  const span = logs.reduce((n, i) => n + (i.e - i.s), 0);
  const seq = [...items].filter((i) => i.kind === "log").sort((a, b) => a.s - b.s);
  let sw = 0;
  for (let i = 1; i < seq.length; i++) if (seq[i].proj !== seq[i - 1].proj) sw++;
  return { logs, done, span, sw, mc: maxConc() };
}
function paintStats() {
  const { logs, done, span, sw, mc } = stats();
  $("#s-log").textContent = logs.length;
  $("#s-done").textContent = done.length;
  $("#s-span").textContent = dur(span);
  $("#s-conc").textContent = mc;
  $("#s-switch").textContent = sw;
}

/* ================= 悬浮 ================= */
const tip = $("#tip");
function showTip(e, html) {
  tip.innerHTML = html; tip.classList.add("on");
  const pad = 10, r = tip.getBoundingClientRect();
  tip.style.left = clamp(e.clientX + 14, pad, innerWidth - r.width - pad) + "px";
  tip.style.top = clamp(e.clientY - r.height - 12, pad, innerHeight - r.height - pad) + "px";
}
function hideTip() { tip.classList.remove("on"); }
function toast(msg) {
  const t = $("#toast"); t.textContent = msg; t.classList.add("on");
  clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("on"), 1700);
}

/* ================= 侧栏 ================= */
function renderSide() {
  const side = $("#side"); side.innerHTML = "";
  const it = items.find((x) => x.id === sel);
  if (!it) {
    const h1 = el("h3", "", "记录");
    const add = el("button", "b add", "＋");
    add.title = "补一条记录";
    add.style.cssText = "float:right;margin-top:-3px;padding:2px 7px;font-size:11px;line-height:1.2";
    add.onclick = (e) => {
      e.stopPropagation();
      const id = "n" + Date.now();
      items.push({ id, title: "新的记录", s: M(10), e: M(10, 30), proj: "mvlab 运营管理", kind: "log" });
      sel = id; render();
    };
    h1.appendChild(add);
    side.appendChild(h1);
    const L = el("div");
    items.filter((x) => x.kind === "log").sort((a, b) => a.s - b.s).forEach((x) => L.appendChild(itemRow(x)));
    side.appendChild(L);
    side.appendChild(el("h3", "sub", "完成"));
    const D = el("div");
    items.filter((x) => x.kind === "done").sort((a, b) => a.s - b.s).forEach((x) => D.appendChild(itemRow(x)));
    side.appendChild(D);
    side.appendChild(el("div", "empty", "点任意一条开始改；图上也能直接拖时间。")).style.marginTop = "9px";
    return;
  }
  const eh = el("h3", "", it.kind === "log" ? "编辑记录" : "编辑完成项");
  const add2 = el("button", "b", "＋");
  add2.title = "再补一条";
  add2.style.cssText = "float:right;margin-top:-3px;padding:1px 7px;font-size:12px;line-height:1.3";
  add2.onclick = () => {
    const id = "n" + Date.now();
    items.push({ id, title: "新的记录", s: M(10), e: M(10, 30), proj: "mvlab 运营管理", kind: "log" });
    sel = id; render();
  };
  eh.appendChild(add2);
  side.appendChild(eh);
  const ed = el("div", "ed");

  const f1 = el("div"); f1.appendChild(el("label", "", "标题"));
  const t = el("input"); t.value = it.title; t.id = "ed-title"; f1.appendChild(t); ed.appendChild(f1);

  const f2 = el("div", "row2");
  const c1 = el("div"); c1.appendChild(el("label", "", it.kind === "log" ? "开始" : "完成时刻"));
  const st = el("input"); st.type = "time"; st.value = fmt(it.s); st.id = "ed-s"; c1.appendChild(st);
  const c2 = el("div"); c2.appendChild(el("label", "", "结束"));
  const en = el("input"); en.type = "time"; en.value = fmt(it.e); en.id = "ed-e";
  if (it.kind === "done") { en.disabled = true; en.style.opacity = .4; }
  c2.appendChild(en);
  f2.append(c1, c2); ed.appendChild(f2);

  const f3 = el("div"); f3.appendChild(el("label", "", "项目"));
  const pj = el("select");
  Object.keys(PROJECTS).forEach((p) => { const o = el("option", "", p); o.value = p; pj.appendChild(o); });
  pj.value = it.proj; pj.id = "ed-p"; f3.appendChild(pj); ed.appendChild(f3);

  const btns = el("div", "btns");
  const ok = el("button", "b pri", "保存"); ok.id = "ed-ok";
  const cc = el("button", "b", "取消"); cc.id = "ed-cancel";
  const del = el("button", "b danger", "删除"); del.id = "ed-del";
  btns.append(ok, cc, del); ed.appendChild(btns);
  side.appendChild(ed);

  const commit = () => {
    it.title = t.value.trim() || it.title;
    it.proj = pj.value;
    const s2 = toMin(st.value);
    it.s = s2; it.e = it.kind === "done" ? s2 : Math.max(s2 + 5, toMin(en.value));
    sel = null; render(it.id); toast("已写回块里");
  };
  ok.onclick = commit;
  cc.onclick = () => { sel = null; render(); };
  del.onclick = () => { items = items.filter((x) => x.id !== it.id); sel = null; render(); toast("已删除这一条"); };
  [t, st, en, pj].forEach((n) => (n.onkeydown = (e) => { if (e.key === "Enter") commit(); }));
  // 与它并行的时段（解释「并发」从哪来）
  const ov = items.filter((x) => x.id !== it.id && x.kind === "log" && x.s < it.e && x.e > it.s);
  side.appendChild(el("h3", "sub", "同时进行的"));
  if (ov.length) {
    const O = el("div");
    ov.forEach((x) => O.appendChild(itemRow(x)));
    side.appendChild(O);
  } else {
    side.appendChild(el("div", "empty", "这段时间只有这一件。"));
  }
  side.appendChild(el("div", "empty", "保存后：图上位置、统计、下面的源码同时变。")).style.marginTop = "8px";
}
function toMin(v) { const [h, m] = v.split(":").map(Number); return h * 60 + m; }
function itemRow(x) {
  const r = el("div", "item" + (sel === x.id ? " on" : ""));
  const bar = el("i"); bar.style.setProperty("--c", PROJECTS[x.proj]);
  const b = el("div");
  b.appendChild(el("div", "t", x.title));
  b.appendChild(el("div", "m", (x.kind === "log" ? `${fmt(x.s)}–${fmt(x.e)} · ${dur(x.e - x.s)}` : `${fmt(x.s)} 完成`) + " · " + x.proj));
  r.append(bar, b);
  r.onclick = () => { sel = x.id; render(); };
  return r;
}

/* ================= 1) 航道：项目堆叠的流 + 完成轨道 + 空档 ================= */
function renderRiver(stage) {
  const W = stage.clientWidth - 32;
  const logs = items.filter((i) => i.kind === "log");
  const done = items.filter((i) => i.kind === "done");
  const levels = pack(logs);
  const laneH = 15, laneGap = 4;
  const railH = 32;
  const plotH = levels * (laneH + laneGap);
  const H = railH + plotH + 34;
  const base = railH + plotH;

  const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  svg.setAttribute("width", W); svg.setAttribute("height", H);
  svg.style.cssText = "display:block;touch-action:none";
  let g = "";

  // 小时网格 + 刻度（只此一套）
  for (let h = Math.ceil(view.from / 60); h * 60 <= view.to; h++) {
    const x = (X(h * 60) / 100) * W;
    g += `<line x1="${x}" y1="${railH - 10}" x2="${x}" y2="${base + 4}" stroke="var(--grid)" stroke-width="1"/>`;
    g += `<text x="${x + 4}" y="${base + 17}" fill="var(--ink4)" font-size="9">${String(h).padStart(2, "0")}:00</text>`;
  }

  // 空档：基线下的括号 + 标注（统一在轴下面，不跟条抢位置）
  const gapY = railH + 11;
  for (let i = 1; i < logs.sort((a, b) => a.s - b.s).length; i++) {
    const prev = logs[i - 1], cur = logs[i];
    const gap = cur.s - prev.e;
    if (gap >= 55) {
      const x0 = (X(prev.e) / 100) * W, x1 = (X(cur.s) / 100) * W;
      g += `<path d="M ${x0 + 4} ${gapY} h ${x1 - x0 - 8}" stroke="var(--line2)" stroke-width="1" stroke-dasharray="1 4" opacity=".9"/>`;
      g += `<text x="${(x0 + x1) / 2}" y="${gapY - 4}" fill="var(--ink5)" font-size="8" text-anchor="middle" letter-spacing=".04em">空 ${dur(gap)}</text>`;
    }
  }

  // 流：每条记录 = 一层圆角块，按层级堆叠（高度=并发，颜色=项目）
  logs.forEach((i) => {
    const x = (X(i.s) / 100) * W, w = Math.max(3, (X(i.e) / 100) * W - x);
    const y = railH + (levels - 1 - i.lv) * (laneH + laneGap);
    const on = hover === i.id || sel === i.id;
    const dim = (hover && hover !== i.id) || (sel && sel !== i.id);
    g += `<rect data-id="${i.id}" x="${x}" y="${y}" width="${w}" height="${laneH}" rx="4"
      fill="${PROJECTS[i.proj]}" opacity="${dim ? .22 : on ? 1 : .82}" style="cursor:grab"/>`;
    if (w > 92) {
      g += `<text x="${x + 7}" y="${y + 10.6}" fill="#fff" fill-opacity="${dim ? .35 : .92}" font-size="9"
        pointer-events="none">${esc(i.title.length > w / 9.6 ? i.title.slice(0, Math.floor(w / 9.6)) + "…" : i.title)}</text>`;
    }
    if (on) g += `<rect x="${x - .5}" y="${y - .5}" width="${w + 1}" height="${laneH + 1}" rx="4.5" fill="none" stroke="var(--ink)" stroke-opacity=".55" stroke-width="1"/>`;
  });

  // 完成轨道
  g += `<rect x="0" y="0" width="${W}" height="${railH - 8}" fill="var(--panel2)" opacity=".55" rx="4"/>`;
  g += `<line x1="0" y1="${railH - 9}" x2="${W}" y2="${railH - 9}" stroke="var(--line2)" stroke-width="1"/>`;
  g += `<text x="7" y="${railH - 16}" fill="var(--ink3)" font-size="8" letter-spacing=".12em">完成</text>`;
  if (doneTime) done.forEach((i) => {
    const x = (X(i.s) / 100) * W;
    const on = hover === i.id || sel === i.id;
    const dim = (hover && hover !== i.id) || (sel && sel !== i.id);
    if (on) g += `<line x1="${x}" y1="${railH - 9}" x2="${x}" y2="${base}" stroke="${PROJECTS[i.proj]}" stroke-dasharray="2 3" opacity=".55"/>`;
    g += `<circle data-id="${i.id}" cx="${x}" cy="${railH - 18}" r="4" fill="${PROJECTS[i.proj]}" opacity="${dim ? .25 : 1}" style="cursor:pointer"/>`;
    g += `<circle cx="${x}" cy="${railH - 18}" r="7.2" fill="none" stroke="${PROJECTS[i.proj]}" stroke-opacity="${dim ? .1 : .34}"/>`;
    g += `<text x="${x + 11}" y="${railH - 15}" fill="${on ? "var(--ink)" : "var(--ink3)"}" font-size="8.5" opacity="${dim ? .28 : 1}">${fmt(i.s)}</text>`;
  });
  function w_ok(x) { return done.filter((d) => Math.abs((X(d.s) / 100) * W - x) < 62).length === 1; }

  // 刷选
  if (brush) {
    const x0 = (X(Math.min(brush.a, brush.b)) / 100) * W, x1 = (X(Math.max(brush.a, brush.b)) / 100) * W;
    g += `<rect x="${x0}" y="${railH - 12}" width="${x1 - x0}" height="${base - railH + 12}" fill="var(--acc)" opacity=".07"/>`;
    g += `<line x1="${x0}" y1="${railH - 12}" x2="${x0}" y2="${base}" stroke="var(--acc)" stroke-opacity=".5"/>`;
    g += `<line x1="${x1}" y1="${railH - 12}" x2="${x1}" y2="${base}" stroke="var(--acc)" stroke-opacity=".5"/>`;
    const n = items.filter((i) => i.kind === "log" && i.s < Math.max(brush.a, brush.b) && i.e > Math.min(brush.a, brush.b)).length;
    const label = `${fmt(Math.min(brush.a, brush.b))}–${fmt(Math.max(brush.a, brush.b))} · ${dur(Math.abs(brush.b - brush.a))} · ${n} 条`;
    g += `<rect x="${clamp(x0 - 2, 0, W - 150)}" y="${railH - 40}" width="146" height="17" rx="4" fill="var(--panel2)" stroke="var(--line2)"/>`;
    g += `<text x="${clamp(x0 + 6, 6, W - 142)}" y="${railH - 28}" fill="var(--ink2)" font-size="8.5">${label}</text>`;
  }

  // 回放游标
  if (playing) {
    const x = (X(playAt) / 100) * W;
    g += `<line x1="${x}" y1="${railH - 34}" x2="${x}" y2="${base}" stroke="var(--acc2)" stroke-width="1.2"/>`;
    g += `<circle cx="${x}" cy="${railH - 34}" r="2.8" fill="var(--acc2)"/>`;
    g += `<text x="${x + 6}" y="${railH - 31}" fill="var(--acc2)" font-size="8.5" font-variant-numeric="tabular-nums">${fmt(Math.round(playAt))}</text>`;
  }

  svg.innerHTML = g;
  stage.appendChild(svg);

  const cap = el("div", "axis");
  cap.innerHTML = `<span>${fmt(view.from)}</span><span>${fmt(view.to)}</span>`;
  stage.appendChild(cap);

  const legend = el("div", "legend");
  Object.entries(PROJECTS).forEach(([p, c]) => {
    const l = el("span", "lg"); const i = el("i"); i.style.background = c;
    l.append(i, el("span", "", p)); legend.appendChild(l);
  });
  const l2 = el("span", "lg"); l2.style.color = "var(--ink4)"; l2.textContent = "↑ 高度 = 同时几件 · ○ 上方 = 完成时刻";
  legend.appendChild(l2);
  stage.appendChild(legend);
  const hint = el("div", "hintline", "拖条改时间 · 空处横拖框选一段看统计 · 滚轮缩放 · 双击还原");
  stage.appendChild(hint);
  if (!doneTime) {
    const box = el("div", "chips");
    const lab = el("span", "chip-lab", "今天完成 " + items.filter((i) => i.kind === "done").length + " 件（只有日期，不知道几点）");
    box.appendChild(lab);
    items.filter((i) => i.kind === "done").forEach((i) => {
      const c2 = el("span", "chip");
      const d = el("i"); d.style.background = PROJECTS[i.proj];
      c2.append(d, el("span", "", i.title));
      c2.onclick = () => { sel = i.id; render(); };
      box.appendChild(c2);
    });
    stage.appendChild(box);
  }
  stage.appendChild(factsRow());

  /* --- 交互：拖动/框选用 window 级监听，重绘不会打断手势 --- */
  const rect0 = () => svg.getBoundingClientRect();
  const mAtClient = (cx, r) => view.from + clamp((cx - r.left) / r.width, 0, 1) * (view.to - view.from);
  const mAt = (x) => view.from + (x / W) * (view.to - view.from);

  const tipFor = (it) => it.kind === "log"
    ? `<b>${esc(it.title)}</b><span>${fmt(it.s)}–${fmt(it.e)} · ${dur(it.e - it.s)} · ${esc(it.proj)}</span>`
    : `<b>${esc(it.title)}</b><span>${fmt(it.s)} 完成 · ${esc(it.proj)}</span>`;

  svg.addEventListener("pointerdown", (e) => {
    const t = e.target.closest("[data-id]");
    const r = rect0();
    const insidePlot = (e.clientY - r.top) > railH - 14;
    if (t) {
      const it = items.find((x) => x.id === t.dataset.id);
      sel = it.id; hover = it.id;
      drag = { id: it.id, x0: e.clientX, w: r.width, s0: it.s, e0: it.e, moved: false };
      render();
    } else if (insidePlot) {
      const a = mAtClient(e.clientX, r);
      brush = { a, b: a };
      drag = { brush: true, w: r.width, rect: r };
      render();
    } else return;
    e.preventDefault();

    const move = (ev) => {
      if (drag.brush) {
        brush.b = mAtClient(ev.clientX, drag.rect || rect0());
        render();
        return;
      }
      const span = view.to - view.from;
      const dxm = ((ev.clientX - drag.x0) / drag.w) * span;
      const step = Math.round(dxm / 5) * 5;
      const it = items.find((x) => x.id === drag.id);
      if (!it) return;
      if (step !== 0) drag.moved = true;
      it.s = clamp(drag.s0 + step, 0, 1435);
      it.e = clamp(drag.e0 + step, it.s + 5, 1440);
      render();
      showTip(ev, `<b>${esc(it.title)}</b><span>${fmt(it.s)}–${fmt(it.e)} · 松手写回</span>`);
    };
    const up = () => {
      window.removeEventListener("pointermove", move);
      window.removeEventListener("pointerup", up);
      if (drag && drag.id && drag.moved) toast("时间已改 · 已写回块里");
      if (drag && drag.brush && Math.abs(brush.b - brush.a) < 15) brush = null;
      drag = null; hideTip(); render();
    };
    window.addEventListener("pointermove", move);
    window.addEventListener("pointerup", up);
  });

  svg.addEventListener("pointermove", (e) => {
    if (drag) return;
    const t = e.target.closest("[data-id]");
    if (t) {
      const it = items.find((x) => x.id === t.dataset.id);
      if (it && hover !== it.id) { hover = it.id; render(); }
      if (it) showTip(e, tipFor(it));
    } else { if (hover) { hover = null; render(); } hideTip(); }
  });
  svg.addEventListener("click", (e) => {
    const t = e.target.closest("[data-id]");
    if (t) { sel = t.dataset.id; render(); }
  });
  svg.addEventListener("pointerleave", () => { if (!drag) { hover = null; hideTip(); render(); } });
}

function factsRow() {
  const logs = items.filter((i) => i.kind === "log").sort((a, b) => a.s - b.s);
  const longest = logs.reduce((m, i) => Math.max(m, i.e - i.s), 0);
  let gaps = 0;
  for (let i = 1; i < logs.length; i++) gaps += Math.max(0, logs[i].s - logs[i - 1].e);
  const row = el("div", "facts");
  [["最长一段", dur(longest)], ["空档合计", dur(gaps)], ["第一件事", logs.length ? fmt(logs[0].s) : "—"]].forEach(([k, v]) => {
    const f = el("div", "fact");
    f.append(el("span", "", k), el("b", "", v));
    row.appendChild(f);
  });
  return row;
}

/* ================= 2) 泳道 ================= */
function renderLanes(stage) {
  const logs = items.filter((i) => i.kind === "log");
  const done = items.filter((i) => i.kind === "done");
  const projs = [...new Set(items.map((i) => i.proj))];
  const rowH = 46;
  const box = el("div");
  box.style.cssText = `position:relative;height:${projs.length * rowH + 22}px`;

  const grid = el("div");
  grid.style.cssText = "position:absolute;inset:0;pointer-events:none";
  for (let h = Math.ceil(view.from / 60); h * 60 <= view.to; h++) {
    const g = el("i");
    g.style.cssText = `position:absolute;left:${X(h * 60)}%;top:0;bottom:16px;width:1px;background:var(--grid)`;
    grid.appendChild(g);
    const tx = el("div", "", String(h).padStart(2, "0") + ":00");
    tx.style.cssText = `position:absolute;left:${X(h * 60)}%;bottom:0;font-size:8.5px;color:var(--ink5);
      transform:translateX(3px);font-variant-numeric:tabular-nums`;
    grid.appendChild(tx);
  }
  box.appendChild(grid);

  projs.forEach((p, idx) => {
    const row = el("div");
    const hot = hover && items.find((x) => x.id === hover)?.proj === p;
    row.style.cssText = `position:absolute;left:0;right:0;top:${idx * rowH}px;height:${rowH}px;border-top:1px solid var(--line);
      ${hot ? "background:rgba(91,108,255,.045)" : ""}`;
    const lab = el("div", "", p);
    lab.style.cssText = "position:absolute;left:0;top:7px;font-size:9.5px;color:var(--ink4)";
    row.appendChild(lab);

    logs.filter((i) => i.proj === p).forEach((i) => {
      const dim = (hover && hover !== i.id) || (sel && sel !== i.id);
      const b = el("div");
      b.dataset.id = i.id;
      b.style.cssText = `position:absolute;left:${X(i.s)}%;width:${Math.max(((i.e - i.s) / (view.to - view.from)) * 100, .4)}%;
        top:23px;height:10px;border-radius:5px;background:${PROJECTS[p]};opacity:${dim ? .24 : .92};cursor:grab;`;
      if (((i.e - i.s) / (view.to - view.from)) * 100 > 7.2) {
        const t = el("div", "", i.title);
        t.style.cssText = `position:absolute;left:${X(i.s) + .6}%;top:24.5px;font-size:9px;color:#fff;opacity:.9;
          pointer-events:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:${((i.e - i.s) / (view.to - view.from)) * 100 - 1}%;z-index:3`;
        row.appendChild(t);
      }
      if (sel === i.id) b.style.boxShadow = "0 0 0 1px var(--ink)";
      row.appendChild(b);
    });
    done.filter((i) => i.proj === p).forEach((i) => {
      const d = el("div");
      d.dataset.id = i.id;
      d.style.cssText = `position:absolute;left:${X(i.s)}%;top:26px;width:6px;height:6px;border-radius:50%;transform:translateX(-50%);
        background:${PROJECTS[p]};opacity:${hover && hover !== i.id ? .28 : 1};cursor:pointer`;
      row.appendChild(d);
    });
    box.appendChild(row);
  });

  stage.appendChild(box);

  // 上下文切换的跳转弧（等布局稳定后用像素坐标画）
  requestAnimationFrame(() => {
    const W = box.clientWidth;
    if (!W) return;
    const seq = [...items].filter((i) => i.kind === "log").sort((a, b) => a.s - b.s);
    const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
    svg.setAttribute("width", W); svg.setAttribute("height", projs.length * rowH + 22);
    svg.style.cssText = "position:absolute;left:0;top:0;pointer-events:none;overflow:visible";
    let paths = "";
    for (let i = 1; i < seq.length; i++) {
      const a = seq[i - 1], b = seq[i];
      if (a.proj === b.proj) continue;
      const x1 = (X(a.e) / 100) * W, x2 = (X(b.s) / 100) * W;
      const y1 = projs.indexOf(a.proj) * rowH + 28, y2 = projs.indexOf(b.proj) * rowH + 28;
      if (x2 < 0 || x1 > W || Math.abs(x2 - x1) < 3) continue;
      const mx = (x1 + x2) / 2;
      paths += `<path d="M ${x1} ${y1} C ${mx} ${y1}, ${mx} ${y2}, ${x2} ${y2}"
        fill="none" stroke="var(--acc2)" stroke-width="1.1" stroke-dasharray="2 3" opacity=".42"/>`;
      const dir = y2 > y1 ? 1 : -1;
      paths += `<path d="M ${x2} ${y2} l -3.4 ${-3.4 * dir} l 6.8 0 z" fill="var(--acc2)" opacity=".55"/>`;
    }
    svg.innerHTML = paths;
    box.appendChild(svg);
  });

  const legend = el("div", "legend");
  Object.entries(PROJECTS).forEach(([p, c]) => {
    const l = el("span", "lg"); const i = el("i"); i.style.background = c;
    l.append(i, el("span", "", p)); legend.appendChild(l);
  });
  const l2 = el("span", "lg"); l2.style.color = "var(--ink4)";
  l2.textContent = "虚线 → 上下文切换（今天 " + stats().sw + " 次）";
  legend.appendChild(l2);
  stage.appendChild(legend);
  if (!doneTime) {
    const box = el("div", "chips");
    const lab = el("span", "chip-lab", "今天完成 " + items.filter((i) => i.kind === "done").length + " 件（只有日期，不知道几点）");
    box.appendChild(lab);
    items.filter((i) => i.kind === "done").forEach((i) => {
      const c2 = el("span", "chip");
      const d = el("i"); d.style.background = PROJECTS[i.proj];
      c2.append(d, el("span", "", i.title));
      c2.onclick = () => { sel = i.id; render(); };
      box.appendChild(c2);
    });
    stage.appendChild(box);
  }
  stage.appendChild(factsRow());

  const onMove = (e) => {
    const t = e.target.closest("[data-id]");
    if (!t) { if (hover) { hover = null; render(); } hideTip(); return; }
    const it = items.find((x) => x.id === t.dataset.id);
    if (it && hover !== it.id) { hover = it.id; render(); }
    if (it) showTip(e, `<b>${esc(it.title)}</b><span>${esc(it.proj)} · ${it.kind === "log" ? fmt(it.s) + "–" + fmt(it.e) : fmt(it.s) + " 完成"}</span>`);
  };
  box.addEventListener("pointermove", onMove);
  box.addEventListener("pointerleave", () => { hover = null; hideTip(); render(); });
  box.addEventListener("click", (e) => {
    const t = e.target.closest("[data-id]");
    if (t) { sel = t.dataset.id; render(); }
  });
}

/* ================= 3) 表盘 ================= */
function renderDial(stage) {
  const S = 300, C = S / 2, R = 118;
  const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  svg.setAttribute("width", S); svg.setAttribute("height", S);
  svg.style.cssText = "display:block;margin:0 auto";
  const ang = (m) => (m / 1440) * Math.PI * 2 - Math.PI / 2;
  const pt = (m, r) => [C + Math.cos(ang(m)) * r, C + Math.sin(ang(m)) * r];
  const arc = (a, b) => {
    const [x1, y1] = pt(a, R), [x2, y2] = pt(b, R);
    return `M ${x1} ${y1} A ${R} ${R} 0 ${b - a > 720 ? 1 : 0} 1 ${x2} ${y2}`;
  };
  let g = "";
  g += `<circle cx="${C}" cy="${C}" r="${R}" fill="none" stroke="var(--line)"/>`;
  g += `<circle cx="${C}" cy="${C}" r="${R - 25}" fill="none" stroke="var(--grid)"/>`;
  for (let h = 0; h < 24; h++) {
    const [x1, y1] = pt(h * 60, R + 3), [x2, y2] = pt(h * 60, R + (h % 3 ? 6 : 11));
    g += `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="var(--line2)"/>`;
    if (h % 3 === 0) {
      const [tx, ty] = pt(h * 60, R + 22);
      g += `<text x="${tx}" y="${ty}" fill="var(--ink4)" font-size="9" text-anchor="middle" dominant-baseline="middle">${String(h).padStart(2, "0")}</text>`;
    }
  }
  items.filter((i) => i.kind === "log").forEach((i) => {
    const dim = (hover && hover !== i.id) || (sel && sel !== i.id);
    const on = sel === i.id || hover === i.id;
    if (on) g += `<path d="${arc(i.s, Math.max(i.e, i.s + 5))}" fill="none" stroke="var(--ink)" stroke-opacity=".22"
      stroke-width="21" stroke-linecap="round"/>`;
    g += `<path data-id="${i.id}" d="${arc(i.s, Math.max(i.e, i.s + 5))}" fill="none" stroke="${PROJECTS[i.proj]}"
      stroke-width="15" stroke-linecap="round" opacity="${dim ? .2 : .9}" style="cursor:pointer"/>`;
  });
  items.filter((i) => i.kind === "done").forEach((i) => {
    const [x, y] = pt(i.s, R - 12);
    const dim = (hover && hover !== i.id) || (sel && sel !== i.id);
    g += `<circle data-id="${i.id}" cx="${x}" cy="${y}" r="3.2" fill="${PROJECTS[i.proj]}" opacity="${dim ? .22 : 1}" style="cursor:pointer"/>`;
  });
  if (playing) {
    const [x1, y1] = pt(playAt, 30), [x2, y2] = pt(playAt, R + 9);
    g += `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="var(--acc2)" stroke-width="1.1"/>
          <circle cx="${x2}" cy="${y2}" r="2.6" fill="var(--acc2)"/>`;
  }
  const { logs, done, span } = stats();
  g += `<text x="${C}" y="${C - 12}" fill="var(--ink)" font-size="25" font-weight="600" text-anchor="middle">${(span / 60).toFixed(1)}<tspan font-size="12" fill="var(--ink3)"> h</tspan></text>`;
  g += `<text x="${C}" y="${C + 9}" fill="var(--ink4)" font-size="9" text-anchor="middle">在轴时长 · ${logs.length} 段</text>`;
  g += `<text x="${C}" y="${C + 24}" fill="var(--ink4)" font-size="9" text-anchor="middle">${done.length} 件完成</text>`;
  svg.innerHTML = g;
  stage.appendChild(svg);

  const legend = el("div", "legend");
  legend.style.marginTop = "0";
  Object.entries(PROJECTS).forEach(([p, c]) => {
    const l = el("span", "lg"); const i = el("i"); i.style.background = c; i.style.borderRadius = "50%";
    l.append(i, el("span", "", p)); legend.appendChild(l);
  });
  stage.appendChild(legend);
  stage.appendChild(el("div", "hintline", "一整天的钟面：外圈是记录，内圈的点是完成的时刻。"));

  svg.addEventListener("pointermove", (e) => {
    const t = e.target.closest("[data-id]");
    if (!t) { hideTip(); if (hover) { hover = null; render(); } return; }
    const it = items.find((x) => x.id === t.dataset.id);
    if (it && hover !== it.id) { hover = it.id; render(); }
    if (it) showTip(e, `<b>${esc(it.title)}</b><span>${it.kind === "log" ? fmt(it.s) + "–" + fmt(it.e) + " · " + dur(it.e - it.s) : fmt(it.s) + " 完成"}</span>`);
  });
  svg.addEventListener("pointerleave", () => { hover = null; hideTip(); render(); });
  svg.addEventListener("click", (e) => {
    const t = e.target.closest("[data-id]");
    if (t) { sel = t.dataset.id; render(); }
  });
}

/* ================= 4) 周脉冲 ================= */
function renderWeek(stage) {
  const days = ["10-28", "10-29", "10-30", "10-31", "11-01", "11-02", "11-03"];
  const wk = ["三", "四", "五", "六", "日", "一", "二"];
  const seed = [
    [0, 1, 2, 1, 0, 0, 0], [1, 2, 3, 1, 1, 0, 0], [2, 3, 3, 2, 1, 0, 0],
    [0, 1, 2, 2, 2, 1, 0], [0, 0, 1, 1, 1, 1, 0], [1, 2, 3, 2, 2, 1, 0], [0, 0, 0, 0, 0, 0, 0],
  ];
  const hours = [9, 12, 15, 18, 21];
  const wrap = el("div");
  wrap.style.cssText = "display:grid;grid-template-columns:44px 1fr;row-gap:3px;column-gap:7px;align-items:center";
  hours.forEach((h, row) => {
    const lab = el("div", "", String(h).padStart(2, "0"));
    lab.style.cssText = "font-size:9px;color:var(--ink4);text-align:right";
    wrap.appendChild(lab);
    const line = el("div");
    line.style.cssText = "display:grid;grid-template-columns:repeat(7,1fr);gap:4px";
    days.forEach((d, col) => {
      const v = seed[col][row];
      const cell = el("div");
      cell.style.cssText = `height:26px;border-radius:4px;background:var(--acc);opacity:${v ? .1 + v * .12 : .04};cursor:pointer`;
      if (col === days.indexOf("11-02")) { cell.style.outline = "1px solid var(--acc2)"; cell.style.outlineOffset = "-1px"; }
      cell.onmouseenter = (e) => showTip(e, `<b>${d} ${String(h).padStart(2, "0")}:00–${String(h + 3).padStart(2, "0")}:00</b><span>${v ? v + " 条记录" : "没有记录"}</span>`);
      cell.onmouseleave = hideTip;
      line.appendChild(cell);
    });
    wrap.appendChild(line);
  });
  const blank = el("div"); wrap.appendChild(blank);
  const dline = el("div");
  dline.style.cssText = "display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;font-size:8.5px;color:var(--ink4);margin-top:2px";
  days.forEach((d, i) => dline.appendChild(el("div", "", d + " " + wk[i])));
  wrap.appendChild(dline);
  stage.appendChild(wrap);

  // 每日总量：7 根细柱，让一周的节奏有“脉搏”感
  const tot = seed.map((col) => col.reduce((a, b) => a + b, 0));
  const mx = Math.max(...tot, 1);
  const bar = el("div");
  bar.style.cssText = "display:grid;grid-template-columns:44px 1fr;column-gap:7px;margin-top:14px;align-items:end";
  bar.appendChild(el("div", ""));
  const bars = el("div");
  bars.style.cssText = "display:grid;grid-template-columns:repeat(7,1fr);gap:4px;align-items:end;height:76px";
  const maxDay = tot.indexOf(mx);
  tot.forEach((v, i) => {
    const wrap2 = el("div");
    wrap2.style.cssText = "display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px";
    const h = Math.max(2, (v / mx) * 56);
    const b2 = el("div");
    b2.style.cssText = `width:100%;height:${h}px;border-radius:3px 3px 1px 1px;background:var(--acc);opacity:${i === maxDay ? .85 : .42}`;
    wrap2.appendChild(el("div", "", String(v))).style.cssText = "font-size:8.5px;color:var(--ink4);font-variant-numeric:tabular-nums";
    wrap2.appendChild(b2);
    bars.appendChild(wrap2);
  });
  bar.appendChild(bars);
  stage.appendChild(bar);
  stage.appendChild(el("div", "hintline", "上：每天 5 个时段的热度；下：每天的记录总量。描边列 = 今天（11-02）"));

  const lg = el("div", "legend");
  lg.innerHTML = `<span class="lg" style="color:var(--ink4)">越亮 = 那半天越忙 · 一周合计 ${tot.reduce((a, b) => a + b, 0)} 条 · 最忙 ${days[maxDay]}</span>`;
  stage.appendChild(lg);
  if (!doneTime) {
    const box = el("div", "chips");
    const lab = el("span", "chip-lab", "今天完成 " + items.filter((i) => i.kind === "done").length + " 件（只有日期，不知道几点）");
    box.appendChild(lab);
    items.filter((i) => i.kind === "done").forEach((i) => {
      const c2 = el("span", "chip");
      const d = el("i"); d.style.background = PROJECTS[i.proj];
      c2.append(d, el("span", "", i.title));
      c2.onclick = () => { sel = i.id; render(); };
      box.appendChild(c2);
    });
    stage.appendChild(box);
  }
  stage.appendChild(factsRow());
}

/* ================= 渲染 ================= */
function render(hit) {
  const stage = $("#stage");
  stage.innerHTML = "";
  paintStats();
  if (mode === "river") renderRiver(stage);
  else if (mode === "lanes") renderLanes(stage);
  else if (mode === "dial") renderDial(stage);
  else renderWeek(stage);
  renderSide();
  renderSource(hit);
}

/* ================= 源码 ================= */
function renderSource(id) {
  const logs = items.filter((i) => i.kind === "log").sort((a, b) => a.s - b.s);
  const done = items.filter((i) => i.kind === "done").sort((a, b) => a.s - b.s);
  const L = [];
  L.push(c("```", "c"), c("tlt-timeline", "k"), c("date: auto", ""), c(`view: ${mode}`, ""), c("```", "c"), c("", ""));
  if (logs.length) { L.push(c("# 记录", "c")); logs.forEach((i) => L.push(c(`- ${fmt(i.s)}–${fmt(i.e)} ${i.title} [proj:: ${i.proj}]`, i.id === id ? "hit" : ""))); }
  if (done.length) { L.push(c("", ""), c("# 完成（只有时刻，画成点）", "c")); done.forEach((i) => L.push(c(`- ${fmt(i.s)} ${i.title} [done:: true] [proj:: ${i.proj}]`, i.id === id ? "hit" : ""))); }
  $("#src").innerHTML = L.map(([t, cls]) => `<span class="${cls}">${esc(t)}</span>`).join("\n");
  if (id) {
    $("#synctxt").textContent = "刚写回";
    clearTimeout(window._sh); window._sh = setTimeout(() => ($("#synctxt").textContent = "已同步"), 1800);
  }
}
function c(t, cls) { return [t, cls]; }

/* ================= 控件 ================= */
$("#modes").addEventListener("click", (e) => {
  const b = e.target.closest(".tab"); if (!b) return;
  mode = b.dataset.mode;
  [...$("#modes").children].forEach((x) => x.classList.toggle("on", x === b));
  render();
});
$("#dtime").addEventListener("click", () => {
  doneTime = !doneTime;
  $("#dtime").textContent = "完成时刻 · " + (doneTime ? "开" : "关");
  $("#dtime").style.color = doneTime ? "" : "var(--ink4)";
  render();
});
$("#theme").addEventListener("click", () => {
  document.body.classList.toggle("light");
  $("#theme").textContent = document.body.classList.contains("light") ? "☀" : "☾";
});
$("#play").addEventListener("click", () => {
  playing = !playing;
  $("#play").textContent = playing ? "❚❚ 暂停" : "▶ 回放";
  if (!playing) { render(); return; }
  playAt = M(8);
  const t0 = performance.now();
  const tick = (now) => {
    if (!playing) return;
    const p = Math.min(1, (now - t0) / 14000);
    playAt = M(8) + p * (M(20) - M(8));
    const cur = items.filter((i) => i.kind === "log" && i.s <= playAt && playAt < i.e);
    if (cur.length) sel = cur[0].id; else sel = null;
    render();
    if (p < 1) requestAnimationFrame(tick);
    else { playing = false; $("#play").textContent = "▶ 回放"; sel = null; render(); }
  };
  requestAnimationFrame(tick);
});
$("#stage").addEventListener("wheel", (e) => {
  if (mode !== "river" && mode !== "lanes") return;
  e.preventDefault();
  const span = view.to - view.from;
  const next = clamp(span * (e.deltaY > 0 ? 1.2 : .84), 90, DAY.to - DAY.from);
  const mid = (view.from + view.to) / 2;
  view = { from: clamp(mid - next / 2, DAY.from, DAY.to - next), to: clamp(mid + next / 2, DAY.from + next, DAY.to) };
  render();
}, { passive: false });
$("#stage").addEventListener("dblclick", () => { view = { ...DAY }; brush = null; render(); });
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") { sel = null; brush = null; render(); }
});
render();
</script>
</body>
